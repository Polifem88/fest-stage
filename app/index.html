<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Театр ФЭСТ · 3D-каталог сцен</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141414'/%3E%3Cpath d='M6 24h20M9 24V10h14v14' stroke='%23ff8a1f' stroke-width='3' fill='none'/%3E%3C/svg%3E" />
</head>
<body class="index">
  <main>
    <h1><b>Театр ФЭСТ</b> · 3D-каталог сцен</h1>
    <p>Интерактивные 3D-планировки сцен и залов театра: геометрия, механика и световое оборудование.</p>
    <ul class="venue-cards" id="venues"></ul>
    <p id="rec" class="rec-note"></p>
  </main>
  <script type="module">
    import './src/ui/style.css';
    import { CATALOG, DEFAULT_VENUE, seatsLabel } from './src/venues/catalog.js';
    import { parseHash, peekVenue } from './src/engine/state.js';
    const touch = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
    document.getElementById('rec').textContent = touch
      ? 'Похоже, вы с телефона — рекомендуем мобильную версию.'
      : 'Похоже, вы с компьютера — рекомендуем полную версию.';
    // ссылка с состоянием (#v=…&s=… или старая #s=… — Большая сцена) передаётся в кнопки своей сцены
    const { v, s } = parseHash(location.hash);
    const linked = s ? (v || peekVenue(s) || DEFAULT_VENUE) : v;
    const STATUS = { draft: 'черновик', soon: 'скоро' };
    const list = document.getElementById('venues');
    for (const venue of CATALOG) {
      const li = document.createElement('li');
      li.className = `venue-card${venue.status === 'soon' ? ' soon' : ''}`;
      li.dataset.venue = venue.id;
      const meta = [venue.type, seatsLabel(venue.seats)].filter(Boolean).join(' · ') || 'модель готовится';
      const badge = STATUS[venue.status] ? `<span class="venue-badge ${venue.status}">${STATUS[venue.status]}</span>` : '';
      const hash = venue.id === linked && location.hash ? location.hash : `#v=${venue.id}`;
      // у сцен «скоро» кнопок нет — достаточно пометки рядом с названием
      const links = venue.status === 'soon'
        ? ''
        : [['desk', 'desktop', '🖥 Компьютер', 'компьютер'], ['mob', 'mobile', '📱 Телефон', 'телефон']]
          .map(([d, file, label, aria]) => `<a class="btn" data-device="${d}" href="${file}.html${hash}" aria-label="${venue.name} — ${aria}">${label}</a>`).join('');
      li.innerHTML = `<div class="venue-info"><b>${venue.name}</b>${badge}<span>${meta}</span></div>${links ? `<div class="venue-links">${links}</div>` : ''}`;
      list.append(li);
    }
  </script>
</body>
</html>
