# Проверка рабочих веток (всё, кроме master): юнит-тесты и сборка, БЕЗ публикации.
# Публикация на GitHub Pages — только из master (pages.yml).
name: Проверка ветки

on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# push в ветку с открытым PR не гоняет проверку дважды
concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Юнит-тесты (площадки, контракт, границы модулей, ссылки, экспорт)
        run: npm test
      - name: Сборка (каждая страница — один html-файл)
        run: npm run build
      - name: Бюджет размера (GEMINI.md §2.1)
        run: node -e "const s=(f)=>require('fs').statSync('dist/'+f).size/1048576;const b={'index.html':0.1,'desktop.html':1.3,'mobile.html':1.3};let ok=true;for(const[f,m]of Object.entries(b)){console.log(f,s(f).toFixed(2),'МБ, бюджет',m);if(s(f)>m)ok=false}process.exit(ok?0:1)"
